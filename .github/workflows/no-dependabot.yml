name: Dependabot auto-reject
on: pull_request

permissions:
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'MyScratchBlocks/scratch-gui'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Reject Dependabot Pull Requests
        run: gh pr close --comment "We don't accept pull requests from Dependabot, so this pull request has been auto-rejected. Thanks to @kRxZykRxZy on issue #8 for the idea! If you think this Dependabot pull request is needed, please create an issue about it on Github." --delete-branch "1"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
