name: Build and Deploy to Codeberg

on:
  push:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: CODEBERG

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install || true

      - name: Build project
        run: npm run build || true

      - name: Push build to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Clone the Codeberg repository
          git clone https://KRXZY_KRXZY:${CODEBERG_TOKEN}@codeberg.org/snaplabs/idk codeberg-repo

          # Remove old ampmod contents
          rm -rf codeberg-repo/ampmod

          # Copy new build into ampmod
          mkdir -p codeberg-repo/ampmod
          cp -r build/* codeberg-repo/ampmod/

          cd codeberg-repo

          # Commit and push changes
          git pull
          git add ampmod
          git commit -m "Update build [skip ci]" || echo "No changes to commit"
          git push origin main
